name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build an unsigned device archive
        run: |
          xcodebuild archive \
            -project RCSMenu.xcodeproj \
            -scheme RCSMenu \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/RCSMenu.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/RCSMenu.xcarchive/Products/Applications/RCSMenu.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/RCSMenu-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RCSMenu-unsigned-ipa
          path: RCSMenu-unsigned.ipa
          if-no-files-found: error
